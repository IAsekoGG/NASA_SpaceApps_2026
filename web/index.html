<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kakhovka · SAR under RFI</title>
<meta name="description" content="NISAR L-band monitoring of the former Kakhovka Reservoir under radio-frequency interference: additive RFI correction and an RFI-aware change test.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/app.css?v=202611152230">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316161a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23eb4034' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f0efec'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <a class="brand" href="#map-sec">
    <span class="mark" aria-hidden="true"></span>
    <span class="brand-t"><b data-i18n="title"></b><small data-i18n="subtitle"></small></span>
  </a>
  <nav>
    <a href="#results" data-i18n="nav_results"></a>
    <a href="#classes" data-i18n="nav_classes"></a>
  </nav>
</header>

<main>
<section id="map-sec" class="map-sec">
  <div class="map-wrap" id="mapWrap">
    <div id="mapA" class="map"></div>
    <div id="mapB" class="map map-top"></div>
    <div class="swipe" id="swipe" role="slider" tabindex="0" aria-label="Межа порівняння: сирий / очищений" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <div class="swipe-line"></div><div class="swipe-knob" aria-hidden="true"></div>
    </div>
    <div class="tag left" id="tagA" data-i18n="tag_raw"></div>
    <div class="tag right" id="tagB" data-i18n="tag_clean"></div>
    <div class="loading" id="loading" hidden></div>
  </div>

  <aside class="panel">
    <div class="ctl">
      <div class="seg" id="modeSeg">
        <button data-v="compare" class="on" data-i18n="view_compare"></button>
        <button data-v="change" data-i18n="view_change"></button>
        <button data-v="agree" data-i18n="view_agree"></button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl" data-i18n="track"></span>
      <div class="seg" id="trackSeg"></div>
    </div>
    <div class="ctl" id="polCtl">
      <span class="lbl" data-i18n="pol"></span>
      <div class="seg" id="mapPol"></div>
    </div>
    <div class="ctl" id="dateCtl">
      <span class="lbl"><span data-i18n="date"></span> <b id="dateNow"></b></span>
      <div class="dates" id="dates"></div>
      <div class="quality" id="quality"></div>
    </div>
    <div class="ctl layers" id="layerCtl">
      <span class="lbl" data-i18n="layers"></span>
      <label class="check"><input type="checkbox" id="rfiToggle"><span data-i18n="rfi_toggle"></span></label>
    </div>
    <div class="legend" id="legend"></div>
    <div class="ctl opts">
      <div class="row2">
        <div class="seg small" id="baseSeg">
          <button data-v="dark" class="on" data-i18n="base_dark"></button>
          <button data-v="sat" data-i18n="base_sat"></button>
        </div>
        <input type="range" id="opacity" min="30" max="100" value="100" aria-label="opacity">
      </div>
    </div>
  </aside>
</section>

<section id="results" class="sec">
  <div class="head"><h2 data-i18n="results_h"></h2><p data-i18n="results_p"></p></div>
  <div class="figs" id="figs"></div>
  <div class="filters">
    <div class="seg small" id="chartTrack"></div>
    <div class="seg small" id="chartPol"><button data-v="hv" class="on">HV</button><button data-v="hh">HH</button></div>
  </div>
  <div class="grid">
    <article class="card wide"><h3 data-i18n="leak_h"></h3><p data-i18n="leak_p"></p><div class="chart" id="chLeak"></div></article>
    <article class="card"><h3 data-i18n="probe_h"></h3><p data-i18n="probe_p"></p><div class="chart" id="chProbe"></div></article>
    <article class="card"><h3 data-i18n="shift_h"></h3><p data-i18n="shift_p"></p><div class="chart" id="chShift"></div></article>
    <article class="card"><h3 data-i18n="when_h"></h3><p data-i18n="when_p"></p><div class="chart" id="chWhen"></div></article>
    <article class="card"><h3 data-i18n="cross_h"></h3><p data-i18n="cross_p"></p><div class="chart" id="chCross"></div></article>
    <article class="card"><h3 data-i18n="bed_h"></h3><p data-i18n="bed_p"></p><div class="chart" id="chBed"></div></article>
  </div>
</section>

<section id="classes" class="sec">
  <div class="head"><h2 data-i18n="classes_h"></h2><p data-i18n="classes_p"></p></div>
  <div class="filters">
    <div class="seg small" id="classTrack"></div>
    <div class="seg small" id="classPol"><button data-v="hh" class="on">HH</button><button data-v="hv">HV</button></div>
    <div class="key" id="classKey"></div>
  </div>
  <div class="classes" id="classGrid"></div>
</section>

</main>

<div class="tooltip" id="tooltip" hidden></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="assets/app.js?v=202611152230"></script>
</body>
</html>
